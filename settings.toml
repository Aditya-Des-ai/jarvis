# Jarvis settings. Safe to share: nothing personal in here.
# To change a setting just for yourself, copy the line into private/settings.toml.

# Who does the thinking.
#   "claude" = smarter. Sees only the cleaned daily summary and the memory notes.
#   "local"  = fully offline. Needs Ollama installed. Weaker advice.
brain = "claude"

# Which Claude model does each job, and how hard it thinks (only when brain = "claude").
# Models: "haiku" (cheapest), "sonnet", "opus" (strongest). Effort: low, medium, high.
claude_model_for_checkins = "haiku"    # the daily morning message
effort_for_checkins = "medium"
claude_model_for_chat = "sonnet"       # everyday conversation, reading background
effort_for_chat = "medium"
claude_model_for_deep = "opus"         # deep mode (strategy talks) and the weekly tidy
effort_for_deep = "medium"

# Which local model to use (only when brain = "local").
local_model = "qwen3:4b"

# When the morning check-in runs. If the laptop is off, it runs at next login.
morning_checkin_time = "09:00"

# The chat window lives at http://localhost:<this number>
chat_port = 8765

# How often the window watcher looks at what I'm doing.
seconds_between_window_checks = 30

# No keyboard or mouse for this long counts as "away".
away_after_seconds = 180

# Where to look for my code projects (to count commits).
folders_with_my_code = ["~"]

# How many past days the brain gets to look at.
days_of_history_for_brain = 7

# Use the local model to sort apps and sites that match no rule in
# digest/categories.toml. Things sorted this way only ever count as time
# totals; their titles are never shown to the brain.
sort_unknown_with_local_model = true

# The areas of my life Jarvis keeps a note for, for example
# ["work", "study", "health", "sleep"]. Empty means: work it out from my files.
areas_of_my_life = []

# Background material older than this many days is treated as "the past":
# useful history, but never taken as a current goal without asking me.
old_after_days = 60

# Where to look for my own notes when drafting the first memory.
folders_with_my_notes = ["~/Documents"]

# To let Jarvis read my Notion, put a key in private/settings.toml like this:
#   notion_key = "ntn_..."
# Never put the key in this file.

# The weekly tidy keeps the notes the brain reads on every message below this
# size (in characters). Whatever no longer fits is moved to the archive, not deleted.
notes_size_limit = 30000

# When the weekly tidy runs.
weekly_tidy_time = "Sun 20:00"
